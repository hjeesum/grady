# Fetch new jobs and email the digest every morning.
name: Daily digest

on:
  schedule:
    # Cron times are in UTC: 06:37 UTC is 6:37am in UK winter, 7:37am in summer.
    # Not on the hour: GitHub's docs say the start of every hour is its busiest
    # time and scheduled runs may be delayed or even dropped then. (The 07:00
    # run on 31 Oct 2026 never started.) Runs can still start late.
    - cron: "37 6 * * *"
  workflow_dispatch:  # adds a "Run workflow" button on GitHub, for running it by hand

# Never run two digests at once: they'd both read the same database and
# could email the same jobs twice.
concurrency:
  group: daily-digest
  cancel-in-progress: false

permissions:
  contents: read  # the database is saved to grady-data with its own token

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Each run starts on a fresh machine, so the database is kept in a separate
      # PRIVATE repository (grady-data): this repository is public, and the
      # database holds Reed jobs, which may only be used privately.
      # DATA_REPO_TOKEN can read and write grady-data and nothing else.
      - name: Restore the job database
        env:
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
          DATA_URL: https://x-access-token:${{ secrets.DATA_REPO_TOKEN }}@github.com/${{ github.repository_owner }}/grady-data.git
        run: |
          mkdir -p data
          # ls-remote fails on a wrong token or network error: stop, rather than
          # start with an empty database and email every old job again.
          # actions/checkout saved this repository's own login as a header that
          # git sends to all of github.com, and it wins over the token in DATA_URL
          # ("Repository not found"). An empty value switches it off for one command.
          own_login_off="http.https://github.com/.extraheader="
          if ! branches=$(git -c "$own_login_off" ls-remote --heads "$DATA_URL" data); then
            echo "Can't reach grady-data: check the DATA_REPO_TOKEN secret."
            # Say why, without printing the token: whose token it is (401 = not
            # a valid token) and whether it can see the repository (404 = can't).
            auth="Authorization: Bearer $DATA_REPO_TOKEN"
            echo "Token belongs to: $(curl -s -H "$auth" https://api.github.com/user | jq -r '.login // .message')"
            echo "grady-data answers HTTP $(curl -s -o /dev/null -w '%{http_code}' -H "$auth" \
              https://api.github.com/repos/${{ github.repository_owner }}/grady-data)"
            exit 1
          fi
          if [ -n "$branches" ]; then
            git -c "$own_login_off" fetch -q --depth=1 "$DATA_URL" data
            git show FETCH_HEAD:jobs.db > data/jobs.db
            echo "Restored jobs.db from grady-data."
          # One-time move: the database used to live on this repository's "data" branch.
          elif git fetch -q --depth=1 origin data; then
            git show FETCH_HEAD:jobs.db > data/jobs.db
            echo "Moved jobs.db from this repository's old data branch."
          else
            echo "No database yet: starting with an empty one."
          fi

      - name: Fetch jobs and send the digest
        run: python -m grady
        env:
          # Secrets come from Settings > Secrets and variables > Actions.
          # GitHub hides their values in the logs.
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          REED_API_KEY: ${{ secrets.REED_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          # Optional: friends' addresses (commas or new lines). They get a blind copy.
          SUBSCRIBERS: ${{ secrets.SUBSCRIBERS }}
          # Not secret, so they're written here instead.
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: "587"

      # Save the database even if sending failed: new jobs are stored but not
      # marked as emailed, so they're sent next time. Every database change is
      # made inside a transaction, so the file is never half-written.
      - name: Save the job database
        if: always()
        env:
          DATA_URL: https://x-access-token:${{ secrets.DATA_REPO_TOKEN }}@github.com/${{ github.repository_owner }}/grady-data.git
        run: |
          if [ ! -f data/jobs.db ]; then
            echo "No database to save."
            exit 0
          fi
          # Build a fresh one-commit branch in a temporary folder, then
          # overwrite "data" with it, so the branch never grows.
          cd "$(mktemp -d)"
          git init -q
          git checkout -q -b data
          cp "$GITHUB_WORKSPACE/data/jobs.db" .
          git add jobs.db
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Job database after run ${{ github.run_number }}"
          # As in the restore step: don't send this repository's own login.
          git -c "http.https://github.com/.extraheader=" push -q --force "$DATA_URL" data
          echo "Saved jobs.db to grady-data."
