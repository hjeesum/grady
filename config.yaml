# Non-secret settings. Safe to commit. Secrets go in .env.

search:
  # Each term is sent to the job APIs as a separate search. The APIs match ALL
  # the words, so short, broad terms find more. Chosen by measuring how many
  # sponsor tech jobs each term found in a week (Oct 2026): every term below
  # found at least one; terms that found none were dropped.
  terms:
    - graduate developer
    - graduate software engineer
    - graduate data
    - graduate IT
    - graduate technology
    - junior developer
    - junior web developer
    - junior data analyst
    - entry level software
  # Stop after this many pages per term (Adzuna 50 jobs, Reed 100 jobs per page).
  # Caps API usage: 9 terms x 5 pages = at most 45 requests per source per run.
  max_pages_per_term: 5
  # Only ask for jobs posted in the last N days. We run daily, so older jobs
  # were already seen on a previous run.
  max_days_old: 7

filters:
  # These filters are applied when building the email. All jobs are still stored.
  # Jobs in these cities are listed first in the email. Jobs elsewhere are still included.
  preferred_cities:
    - London
    - Manchester
    - Edinburgh
    - Bristol
  # true: remote jobs are listed near the top, alongside preferred cities.
  # false: remote jobs are left out of the email.
  remote_ok: true
  # Annual salary in GBP. Jobs whose stated maximum is lower are left out.
  # Jobs with no salary listed are kept.
  min_salary: 30000
  # A job's title must contain at least one of these whole words (case-insensitive).
  # This keeps out non-tech graduate jobs. Leave the list empty to allow every title.
  include_keywords:
    - software
    - developer
    - programmer
    - data
    - IT
    - technology
    - tech
    - AI
    - machine learning
    - ML
    - cloud
    - devops
    - cyber
    - web
    - full stack
    - frontend
    - backend
    - python
    - java
    - .net
  # A job is left out if its title contains any of these whole words (case-insensitive).
  exclude_keywords:
    - senior
    - lead
    - principal
    - staff
    - head of
    - manager
  # Companies whose jobs are never emailed. Each entry matches the START of a
  # company name, like the agency list below.
  # ITOL Recruit: posts the same "trainee" advert in dozens of places; reported
  # to be a paid training provider rather than an employer.
  blocked_companies:
    - itol recruit

email:
  # The most jobs to list in each section; the email says how many more there are.
  max_sponsor_jobs: 30
  max_agency_jobs: 10

agencies:
  # Recruitment agencies hide the real employer, so we can't check sponsorship.
  # Their jobs go in a separate "check sponsorship yourself" section of the email.
  # Names containing words like "recruitment" or "staffing" are detected
  # automatically; list here the agencies whose names don't say so.
  # Each entry matches the START of a company name: "hays" also covers
  # "Hays Construction and Property".
  known_names:
    - bristow holland
    - candidate source
    - chapman tate
    - erin associates
    - ets technical
    - hays
    - manpower
    - morson
    - noir
    - office angels
    - oscar technology
    - oxford knight
    - pertemps
    - randstad
    - reed
    - robert half
    - sanderson
    - searchability
    - sellick partnership
    - sr2
    - talent international
    - thorn baker
