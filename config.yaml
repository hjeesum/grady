# Non-secret settings. Safe to commit. Secrets go in .env.

search:
  # Each term is sent to the job APIs as a separate search.
  terms:
    - graduate software engineer
    - junior software developer
    - graduate developer
    - junior data engineer
    - graduate data analyst
  # Stop after this many pages (50 jobs each) per term. Caps API usage:
  # 5 terms x 5 pages = at most 25 requests per run.
  max_pages_per_term: 5
  # Only ask for jobs posted in the last N days. We run daily, so older jobs
  # were already seen on a previous run.
  max_days_old: 7

filters:
  # Jobs in these cities are listed first in the digest. Jobs elsewhere are still kept.
  preferred_cities:
    - London
    - Manchester
    - Edinburgh
    - Bristol
  # Keep remote jobs even if they are not in a preferred city.
  remote_ok: true
  # Annual salary in GBP. Jobs that state a lower maximum salary are dropped.
  # Jobs with no salary listed are kept.
  min_salary: 30000
  # A job is dropped if its title contains any of these (case-insensitive).
  # (Applied when building the email.)
  exclude_keywords:
    - senior
    - lead
    - principal
    - staff
    - head of
    - manager

agencies:
  # Recruitment agencies hide the real employer, so we can't check sponsorship.
  # Their jobs go in a separate "check sponsorship yourself" section of the email.
  # Names containing words like "recruitment" or "staffing" are detected
  # automatically; list here the agencies whose names don't say so.
  # Each entry matches the START of a company name: "hays" also covers
  # "Hays Construction and Property".
  known_names:
    - bristow holland
    - candidate source
    - chapman tate
    - erin associates
    - ets technical
    - hays
    - morson
    - noir
    - office angels
    - oscar technology
    - oxford knight
    - pertemps
    - randstad
    - reed
    - sanderson
    - searchability
    - sellick partnership
    - sr2
    - talent international
    - thorn baker
