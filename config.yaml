# Non-secret settings. Safe to commit. Secrets go in .env.

search:
  # Stop after this many pages per term (Adzuna 50 jobs, Reed 100 jobs per page).
  max_pages_per_term: 5
  # Only ask for jobs posted in the last N days. We run daily, so older jobs
  # were already seen on a previous run.
  max_days_old: 7

# Which profile's digest is emailed to EMAIL_TO.
my_profile: tech

filters:
  # Shared by every profile. Applied when building the email; all jobs are still stored.
  # Jobs in these cities are listed first in the email. Jobs elsewhere are still included.
  preferred_cities:
    - London
    - Manchester
    - Edinburgh
    - Bristol
  # true: remote jobs are listed near the top, alongside preferred cities.
  # false: remote jobs are left out of the email.
  remote_ok: true
  # Left out of every profile if the title contains any of these whole words.
  # Profiles add their own below. (Not "staff": "Staff Nurse" is an entry-level job.)
  exclude_keywords:
    - senior
    - lead
    - principal
    - head of
    - director
    # Only open to the employer's current staff (common on NHS Jobs)
    - internal applications only
    - internal candidates only
  # Companies whose jobs are never emailed. Each entry matches the START of a
  # company name, like the agency list below.
  # ITOL Recruit: posts the same "trainee" advert in dozens of places; reported
  # to be a paid training provider rather than an employer.
  blocked_companies:
    - itol recruit

# One profile per kind of job. All profiles' search terms are fetched once per
# run; each profile then picks its own jobs with its own filters.
# Only tech for now (Oct 2026). Healthcare, engineering, finance, law and
# graduate-scheme profiles existed before; they're in git history to copy back.
#   terms:            sent to the job APIs. The APIs match ALL the words, so
#                     short, broad terms find more.
#   include_keywords: a title must contain at least one (whole words, any case).
#   exclude_keywords: added to the shared list above.
#   min_salary:       jobs stating a lower maximum are left out; "not given" is kept.
#   sources:          optional; which job sources to search (default: adzuna, reed).
#                     nhs_jobs searches NHS Jobs, Band 5 (entry level) only. Its
#                     keyword search is loose, so only use it for healthcare terms.
profiles:
  tech:
    name: Tech
    # Measured (Oct 2026): each term found at least one sponsor tech job in a week.
    terms:
      - graduate developer
      - graduate software engineer
      - graduate data
      - graduate IT
      - graduate technology
      - junior developer
      - junior web developer
      - junior data analyst
      - entry level software
    include_keywords:
      - software
      - developer
      - programmer
      - data
      - IT
      - technology
      - tech
      - AI
      - machine learning
      - ML
      - cloud
      - devops
      - cyber
      - web
      - full stack
      - frontend
      - backend
      - python
      - java
      - .net
      - firmware
      - embedded
      # Not "infrastructure": "Graduate Infrastructure Engineer" is often civil engineering.
    exclude_keywords:
      - staff  # "Staff Engineer" is a senior tech role
      - manager
      # Matched "data"/"tech" but aren't developer roles (seen in real results):
      # "Technical Product Owner", "Interim Financial Controller".
      - product owner
      - interim
    # No maximum salary: tried 60000 (Oct 2026), but it removed real junior jobs,
    # and top graduate jobs (quant firms, big tech) pay well above that.
    min_salary: 30000

# Jobs straight from employers' own job boards (Greenhouse, Lever, Ashby,
# SmartRecruiters, Workable, Recruitee, Teamtailor).
# Every open job is downloaded; only UK jobs with an entry-level word in the
# title are kept, then each profile's filters apply as usual.
# Find and check a company with: python -m scripts.find_boards "Company Name"
boards:
  entry_level_keywords:
    - graduate
    - grad
    - junior
    - entry level
    - entry-level
    - early career
    - early careers
    - new grad
    - trainee
    - apprentice
    - apprenticeship
  # Boards that scripts/discover_boards.py matched to the wrong company: the
  # register company has the same one-word name as a different firm's board.
  # Found by checking the discovered list by hand (Oct 2026). Format: ats:token
  wrong_boards:
    - ashby:academia      # Academia Ltd (UK IT reseller) vs Academia.edu
    - greenhouse:prophet  # Prophet plc (Leeds software) vs Prophet (brand consultancy)
    - ashby:perk          # Perk UK Ltd (since 1999) vs Perk, formerly TravelPerk
    - ashby:harmonic      # Harmonic (UK), video tech, vs Harmonic, the AI company
    # Found via Common Crawl (Nov 2026). When unsure, left out: a non-sponsor
    # job shown as "sponsor" costs more than missing one.
    - ashby:applied       # Applied Group vs Applied Intuition (US)
    - greenhouse:arco     # Arco Ltd (UK safety) vs ARCO Companies (US construction)
    - recruitee:msf       # MSF Group (Bluebird Care) vs MSF, the charity
    - greenhouse:impact   # Impact vs impact.com
    - ashby:kernel        # Kernel Limited vs Kernel, an AI start-up
    - greenhouse:map      # MAP Group (UK): board only says "MAP"
    - ashby:outset        # Outset Limited vs Outset, a US AI start-up
    - ashby:cinder        # Cinder vs Cinder, a US start-up
    - teamtailor:showcase # Showcase Group: board only says "Showcase"
    - ashby:ramp          # The Ramp vs Ramp, the US fintech
    - greenhouse:toast    # Toast vs Toast, the US restaurant software firm
    - ashby:velocity      # Velocity UK Holdings vs Velocity, a fintech
    # Workday (Nov 2026). Token = "host/site".
    - workday:applied.wd501/applied       # Applied Group vs Applied Industrial (US)
    - workday:benchmark.wd1/pgh_careers   # Benchmark Group vs Benchmark Electronics (US)
    - workday:circle.wd1/circle           # "Circle" on the register: can't tell which Circle
    - workday:citi.wd5/2                  # "Citi Group" on the register isn't Citigroup
    - workday:fox.wd1/domestic            # The Fox (a pub) vs Fox Corporation (US)
    - workday:gcu.wd1/gce                 # GCU (UK) vs Grand Canyon Education (US)
    - workday:healthcare.wd1/search       # The Healthcare Group vs an unknown "healthcare" site
    - workday:target.wd5/targetcareers    # Target Group vs Target, the US retailer
    # Internal sites: only the company's own staff can apply.
    - workday:fticonsulting.wd108/fticonsultingcareersprivate
    - workday:medtronic.wd1/redeploymentmedtroniccareers
    - workday:pfizer.wd1/internaljobs
  # Checked with find_boards (Oct 2026): each has a board with UK jobs, and the
  # name matches the sponsor register. Use the legal name when the brand is
  # ambiguous ("Elastic" matched a different company, Elastic Path Software).
  # Most have no entry-level jobs open right now; they're listed so new
  # graduate roles are caught when they appear. One request per company per run.
  companies:
    - {name: Canonical, ats: greenhouse, token: canonical}
    - {name: Cognism, ats: greenhouse, token: cognism}
    - {name: Databricks, ats: greenhouse, token: databricks}
    - {name: Deliveroo, ats: greenhouse, token: deliveroo}
    - {name: Elasticsearch, ats: greenhouse, token: elastic}
    - {name: Form3, ats: greenhouse, token: form3}
    - {name: GoCardless, ats: greenhouse, token: gocardless}
    - {name: Graphcore, ats: greenhouse, token: graphcore}
    - {name: Isomorphic Labs, ats: greenhouse, token: isomorphiclabs}
    - {name: Jane Street, ats: greenhouse, token: janestreet}
    - {name: Monzo, ats: greenhouse, token: monzo}
    - {name: MongoDB, ats: greenhouse, token: mongodb}
    - {name: PhysicsX, ats: greenhouse, token: physicsx}
    - {name: PolyAI, ats: greenhouse, token: polyai}
    - {name: Stripe Payments UK, ats: greenhouse, token: stripe}
    - {name: Tide Platform, ats: greenhouse, token: tide}
    - {name: Farfetch, ats: lever, token: farfetch}
    - {name: Palantir, ats: lever, token: palantir}
    - {name: Spotify, ats: lever, token: spotify}
    - {name: Zopa, ats: lever, token: zopa}
    - {name: Beamery, ats: ashby, token: beamery}
    - {name: Duffel, ats: ashby, token: duffel}
    - {name: ElevenLabs, ats: ashby, token: elevenlabs}
    - {name: Faculty Science, ats: ashby, token: faculty}
    - {name: Improbable, ats: ashby, token: improbable}
    - {name: Lendable, ats: ashby, token: lendable}
    - {name: Marshmallow, ats: ashby, token: marshmallow}
    - {name: Motorway, ats: ashby, token: motorway}
    - {name: Multiverse, ats: ashby, token: multiverse}
    - {name: Paddle, ats: ashby, token: paddle}
    - {name: Pleo, ats: ashby, token: pleo}
    - {name: Primer, ats: ashby, token: primer}
    - {name: Quantexa, ats: ashby, token: quantexa}
    - {name: Snyk, ats: ashby, token: snyk}
    - {name: Synthesia, ats: ashby, token: synthesia}
    - {name: Thought Machine, ats: ashby, token: thought-machine}
    - {name: Trading 212, ats: ashby, token: trading212}
    - {name: Wayve, ats: ashby, token: wayve}
    - {name: Zilch, ats: ashby, token: zilch}
    # "wise" on Greenhouse is a US firm; Wise (the UK fintech) is on SmartRecruiters.
    - {name: Wise Payments, ats: smartrecruiters, token: wise}
    # Workday sites (found via Common Crawl, Nov 2026). Listed by hand because
    # several register companies start with the same word ("Blackrock" includes a
    # café), so discovery rightly refuses to guess. Token = "host/site".
    - {name: Barclays Bank PLC, ats: workday, token: barclays.wd3/external_career_site_barclays}
    - {name: BlackRock Investment Management (UK) Limited, ats: workday, token: blackrock.wd1/blackrock_professional}
    # Discovery matched these sites to the wrong register name; these are the
    # register companies that actually employ their UK staff.
    - {name: Depop Limited, ats: workday, token: etsy.wd5/depop_careers}
    - {name: Neuberger Berman Europe Limited, ats: workday, token: nb.wd1/nbcareers}
    - {name: Northern Trust Management Services Limited, ats: workday, token: ntrs.wd1/northerntrust}
    - {name: Protiviti Limited, ats: workday, token: roberthalf.wd1/protivitiemeacareers}
    - {name: World Vision International Global Centre, ats: workday, token: worldvision.wd1/worldvisioninternational}

site:
  # The public job page (https://hjeesum.github.io/grady/). Link to a Google Form
  # where friends leave their email; answers go only to your Google account, and
  # you copy new addresses into the SUBSCRIBERS secret. Empty = no sign-up box.
  signup_url: https://docs.google.com/forms/d/e/1FAIpQLSdaAlknA8YCpuzZ8QJ50ZQu3UVw0-vhmmWo8eZwi8ldtGZnog/viewform

email:
  # The most jobs to list in each section; the email says how many more there are.
  max_sponsor_jobs: 30
  max_agency_jobs: 10

agencies:
  # Recruitment agencies hide the real employer, so we can't check sponsorship.
  # Their jobs go in a separate "check sponsorship yourself" section of the email.
  # Names containing words like "recruitment" or "staffing" are detected
  # automatically; list here the agencies whose names don't say so.
  # Each entry matches the START of a company name: "hays" also covers
  # "Hays Construction and Property".
  known_names:
    - bristow holland
    - candidate source
    - chapman tate
    - erin associates
    - ets technical
    - hays
    - manpower
    - morson
    - noir
    - office angels
    - oscar technology
    - oxford knight
    - pertemps
    - randstad
    - reed
    - robert half
    - sanderson
    - searchability
    - sellick partnership
    - sr2
    - talent international
    - thorn baker
